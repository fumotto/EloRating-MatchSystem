# デプロイ（11_Deployment.md 8章・9章）。
#
# ★リリース順序が重要である。バックエンドを先に適用する（9章）。
#   新しいフロントエンドが旧スキーマを参照する時間帯を作らないためである。
#   本ワークフローは backend → frontend の順に依存させ、順序を守れないようにしてある。
#
# バックエンド（Migration / Edge Functions）の適用には Supabase の資格情報が要る。
# 登録手順は docs/project/SetupRunbook.md 作業6・作業7にある（人手作業）。
name: Deploy

on:
  # 誤爆を避けるため push では動かさない。公開は明示的な操作で行う。
  workflow_dispatch:
    inputs:
      skip_backend:
        description: "バックエンドの適用を飛ばす（フロントエンドのみ再公開する場合）"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 同一コミットの検証が既に済んでいるかを調べる。
  #
  # ★同じコミットの同じ検証を二度走らせない。効くのは主に次の2つである。
  #     - バックエンドで失敗した公開のやり直し
  #     - skip_backend によるフロントエンドのみの再公開
  #   どちらも検証内容は1回目と同一であり、6分をもう一度使う理由が無い。
  #
  # ★PR運用では merge コミットの SHA は PR の SHA と異なる。よって初回の公開では
  #   必ず検証が走る。**これは意図した挙動である。** merge した結果そのものは
  #   まだ一度も検証されていない。
  #
  # ★24時間で期限を切る。Supabase CLI・Deno・Playwright のイメージは日々更新されるため、
  #   古い成功をもって「今も通る」とは言えない（ci.yml の夜間実行と同じ理由）。
  precheck:
    runs-on: ubuntu-latest
    # 実行履歴の参照にのみ使う。リポジトリ既定に依存させず明示する。
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Look for a recent successful verification of this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          fresh() {
            # $1 = ISO8601。24時間以内なら 0 を返す。
            [ -z "$1" ] && return 1
            age=$(( ( $(date -u +%s) - $(date -u -d "$1" +%s) ) / 3600 ))
            echo "  検証時刻 $1（${age}時間前）"
            [ "$age" -lt 24 ]
          }

          # ① 独立した CI 実行（fast-forward merge や、同一SHAでPRを回した場合）
          ci=$(gh api "/repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" \
                 --jq '.workflow_runs[0].updated_at // empty')
          if fresh "$ci"; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
            echo "CI が成功済み。検証を省く"
            exit 0
          fi

          # ② 過去の公開に含まれる検証（やり直し・フロントのみ再公開）
          #    ★実行全体ではなくジョブの結果を見る。バックエンドで失敗した実行でも
          #      検証そのものは通っている。
          for id in $(gh api "/repos/$REPO/actions/workflows/deploy.yml/runs?head_sha=$SHA&per_page=5" \
                        --jq '.workflow_runs[].id'); do
            done_at=$(gh api "/repos/$REPO/actions/runs/$id/jobs" \
                        --jq '[.jobs[] | select(.name == "verify / verify" and .conclusion == "success")][0].completed_at // empty')
            if fresh "$done_at"; then
              echo "verified=yes" >> "$GITHUB_OUTPUT"
              echo "過去の公開（run $id）で検証済み。検証を省く"
              exit 0
            fi
          done

          echo "verified=no" >> "$GITHUB_OUTPUT"
          echo "このコミットの新しい検証結果は無い。検証を実行する"

  # 公開前に CI と同じ検証を通す（9章の手順1）。
  # ★precheck が最近の成功を見つけた場合のみ省く。
  verify:
    needs: precheck
    if: ${{ needs.precheck.outputs.verified != 'yes' }}
    uses: ./.github/workflows/ci.yml

  backend:
    needs: [precheck, verify]
    # ★verify が skipped のときも進める。always() が無いと needs の skip で自身も skip になる。
    #   「検証が通った」か「最近通っている」かのどちらかを必須とする。
    if: >-
      ${{ always()
          && (needs.verify.result == 'success' || needs.precheck.outputs.verified == 'yes')
          && !inputs.skip_backend }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # 適用前のスキーマを控える（11_Deployment.md 12章）。
      #
      # down migration は作らない方針であるため（10.2）、復旧は forward fix で行う。
      # そのとき「適用前がどうだったか」が要るので、差分の基準としてここで保存する。
      #
      # ★データはダンプしない。GitHub の成果物は組織内で広く参照でき、
      #   本番の個人情報をそこへ置くのは漏洩経路を自ら作ることになる。
      #   データの復旧は Supabase 側のバックアップ／PITR を使う（SetupRunbook 10章）。
      - name: Capture pre-migration schema
        run: supabase db dump --linked -f pre-migration-schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload pre-migration schema
        uses: actions/upload-artifact@v4
        with:
          name: pre-migration-schema-${{ github.run_id }}
          path: pre-migration-schema.sql
          retention-days: 30

      # ★追加方式である（10.1）。適用済みの Migration を編集してはならない。
      #   down migration は作らない。打ち消す Migration を足して復旧する（10.2）。
      - name: Apply migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 適用直後の健全性確認（11_Deployment.md 13章）。ここで落ちれば公開へ進まない。
      #
      # 接続文字列は Secret で与える。未登録なら飛ばす。
      # 「確認したつもり」で通過させないよう、飛ばしたことを明示的に警告へ出す。
      - name: Post-migration health check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL が未登録のため健全性確認を飛ばした（SetupRunbook 9.1）"
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/health-check.sql

  frontend:
    # ★backend の後に置く。skip_backend のときも always() で到達させるが、
    #   backend が失敗した場合は公開しない。
    needs: [precheck, verify, backend]
    if: >-
      ${{ always()
          && (needs.verify.result == 'success' || needs.precheck.outputs.verified == 'yes')
          && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # VITE_ 接頭辞の変数はビルド成果物へ埋め込まれ公開される（4.1）。
      # Secret ではなく Variable でよい。Service Role Key をここへ入れてはならない。
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # ★末尾のスラッシュを含めて `/EloRating-MatchSystem/` とする（6章）。
          #   誤ると本番でのみアセットが404になる。ローカルでは `/` で動くため気付けない。
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}

      # 直リンクとリロードの404を防ぐ（7章 / R-005）。build スクリプトが生成する。
      - name: Verify SPA fallback exists
        run: test -f dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
