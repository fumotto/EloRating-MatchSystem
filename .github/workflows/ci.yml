# CI（11_Deployment.md 11.1）。
#
# ステップの順序は同章の定義に従う。S5 / S6 で Database Test（pgTAP）と E2E Test（Playwright）を
# 追加したため、11.3.2 で予約していたステップをすべて有効化してある。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Deploy ワークフローから呼び出す（9章の手順1）。
  # 公開前に PR と同じ検証を通すため、検証を二重に定義しない。
  workflow_call:
  # 夜間定期実行（JST 10:00 / UTC 01:00）。
  # 外部依存（Supabase CLI・Deno・Playwright のイメージ）は日々更新されるため、
  # PRが無い日でも壊れていないことを確かめる。
  schedule:
    - cron: "0 1 * * *"

# 同一ブランチの古い実行は打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 秘密情報と一時ファイルの混入を防ぐ（11_Deployment.md 14章）。
  # ★verify とは独立させる。重い検証の後ろに置くと、混入に気付くのが遅れる。
  secrets-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks は履歴を走査する。浅いクローンでは過去のコミットを見られない。
          fetch-depth: 0

      # 追跡してはならないファイルが混入していないか、名前で確かめる。
      # gitleaks は「値」を見るが、こちらは「そのファイルが存在すること自体」を弾く。
      - name: Check for tracked secrets and temporary files
        run: |
          # .env.example は値が空のテンプレートであり、追跡してよい唯一の .env 系である。
          tracked=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|(^|/)supabase/\.(temp|branches)/|(^|/)\.env\.ci$' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::追跡してはならないファイルがコミットされている:"
            echo "$tracked"
            exit 1
          fi
          echo "追跡対象に秘密情報・一時ファイルは無い"

      # 値そのものの検出。履歴全体を対象にする。
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source=/repo --redact --no-banner \
            --config=/repo/.gitleaks.toml

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # フロントエンドと Unit Test は Bun（11_Deployment.md 11.3）。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Edge Functions と Integration Test は Deno。
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Database Test と E2E は Supabase Local（Docker）を使う。
      # 本番環境に対してテストを実行してはならない（11.3）。
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format Check (oxfmt)
        run: bun run format:check

      # Node 側（tsc）と Deno 側（deno check）の二本立て。片方だけでは全コードを検査できない。
      - name: Type Check (tsc + deno check)
        run: bun run typecheck

      - name: Start Supabase Local
        run: |
          supabase start
          # 鍵とURLは起動のたびに出力から取る。ワークフローへ書き写さない。
          # ★出力は KEY="value" 形式である。引用符を外さないと値に " が混ざり、
          #   Service Role Key が壊れて Admin API が invalid JWT になる。
          supabase status -o env | sed -e 's/="/=/' -e 's/"$//' >> "$GITHUB_ENV"

      # Migration が最初から通ることを確かめる。差分適用ではなく作り直す。
      - name: Apply migrations
        run: supabase db reset

      - name: Unit Test (Vitest)
        run: bun run test:unit

      - name: Integration Test (Deno Test)
        run: bun run test:integration

      # Frontend Test は Unit Test と同じ Vitest 実行に含まれる（src/**/*.test.tsx）。

      - name: Database Test (pgTAP)
        run: bun run test:db

      - name: Build
        run: bun run build
        env:
          # ビルドが通ることのみを確認する。値の正しさはここでは検証しない。
          # 本番の値は GitHub Environment Secrets / Variables で与える（11_Deployment.md 4.1）。
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_BASE_PATH: /

      # 404.html は bun run build が生成する（11_Deployment.md 7章 / R-005）。
      - name: Verify SPA fallback exists
        run: test -f dist/404.html

      - name: Install Playwright browser
        run: bun x playwright install --with-deps chromium

      # ★E2E は Edge Functions を実際に呼ぶ。起動しておかないと全ケースが SYSTEM-001 になる。
      #   SUPABASE_DB_URL にはコンテナ名を使う（SetupRunbook 5.2）。
      #   127.0.0.1 はコンテナ自身を指すため、Function から DB へ届かない。
      - name: Serve Edge Functions
        run: |
          echo "SUPABASE_DB_URL=postgresql://postgres:postgres@supabase_db_$(basename "$PWD"):5432/postgres" \
            > .env.ci
          supabase functions serve --env-file .env.ci &
          # 起動を待つ。ここで待たないと最初のE2Eが接続エラーになる。
          for _ in $(seq 1 30); do
            # 応答が返れば十分である。-f は付けない。内部処理Functionは
            # Service Role 以外に 403 を返すため、-f だと成功と見なせない。
            curl -s -o /dev/null "http://127.0.0.1:54321/functions/v1/matchmaker" && break
            sleep 2
          done

      - name: E2E Test (Playwright)
        run: bun run test:e2e
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
